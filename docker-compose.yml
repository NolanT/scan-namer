services:
  scan-namer:
    # To use the pre-built image from GitHub Container Registry:
    image: ghcr.io/nolant/scan-namer:main
    # To build locally instead, comment out 'image' above and uncomment:
    # build: .
    container_name: scan-namer
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - SCAN_NAMER_MODEL=claude-haiku-5-5   # override the Claude model
      # - OCR_JOBS=2                          # CPU cores for OCR (default 1)
      # - FILING_ROOT=/archive                # enable folder suggestions (see README)
      # - FILING_EXCLUDE=Private,Old Backups  # folders to leave out of suggestions
    volumes:
      # Mount your scan folder here (change the left side to your actual path)
      - /volume1/scans:/scans
      # Optional, for folder suggestions: your document archive, READ-ONLY
      # - /volume1/documents:/archive:ro
    # Default: watch mode (auto-renames new files)
    # Uncomment below to customize:
    # command: ["/scans", "--watch", "--settle-time", "15", "--watch-interval", "60"]
    #
    # For one-time batch mode instead of watch:
    # command: ["/scans"]
    #
    # For dry-run (preview only):
    # command: ["/scans", "--dry-run"]
